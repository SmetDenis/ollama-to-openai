version: "3.8"

services:
  ollama-to-openai:
    build:
      context: .
      no_cache: true
    pull_policy: build
    ports:
      - "11345:11434"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./prompts:/app/prompts:ro
      - ./ollama_to_openai_adapter.py:/app/ollama_to_openai_adapter.py:ro
    restart: unless-stopped
