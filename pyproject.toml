[project]
name = "ollama-to-openai"
version = "0.1.0"
description = "Ollama to OpenAI proxy server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "openai>=1.108.2",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "mypy>=1.15",
    "types-PyYAML>=6.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.uv]
constraint-dependencies = ["werkzeug>=3.1.6"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma — conflicts with ruff formatter
    "ISC001", # single-line-implicit-string-concatenation — conflicts with ruff formatter
    "D203",   # one-blank-line-before-class — conflicts with D211
    "D213",   # multi-line-docstring-summary-second-line — conflicts with D212
    "FIX",    # fixme/todo comments
    "TD",     # todo formatting
    "EXE002", # executable-no-shebang — SMB filesystem does not support chmod
    "ANN401", # dynamically-typed-expressions — unavoidable with Flask/OpenAI SDK
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"

[tool.ruff.lint.per-file-ignores]
"__main__.py" = ["INP001"]
"tests/**/*.py" = ["S101", "S104", "PLR2004", "D", "ANN", "ERA001", "PLC0415", "ARG002", "RUF059", "PT011"]
