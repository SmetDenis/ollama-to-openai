[project]
name = "ollama-to-openai"
version = "0.1.0"
description = "Ollama to OpenAI proxy server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "openai>=1.108.2",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma — конфликт с ruff formatter
    "ISC001", # single-line-implicit-string-concatenation — конфликт с ruff formatter
    "D203",   # one-blank-line-before-class — конфликт с D211
    "D213",   # multi-line-docstring-summary-second-line — конфликт с D212
    "FIX",    # fixme/todo comments
    "TD",     # todo formatting
    "EXE002", # executable-no-shebang — SMB filesystem не поддерживает chmod
    "ANN401", # dynamically-typed-expressions — неизбежен с Flask/OpenAI SDK
]

[tool.ruff.lint.per-file-ignores]
"__main__.py" = ["INP001"]
